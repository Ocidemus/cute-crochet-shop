<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - CuteCrochet Shop</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <!-- CSS styles -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .orders-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .order-card {
            background: #FFFDFC;
            border: 2px solid var(--primary-light);
            border-radius: var(--border-radius-lg);
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 141, 161, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 141, 161, 0.1);
        }
        .order-header {
            background: var(--bg-main);
            padding: 20px;
            border-bottom: 2px dashed var(--primary-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-meta-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .order-meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-meta-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .order-meta-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge.paid {
            background-color: #EBFDF8;
            color: #1E6652;
            border: 1px solid #C4F7E6;
        }
        .status-badge.pending {
            background-color: #FFF8E6;
            color: #B27B00;
            border: 1px solid #FFEBB3;
        }
        .status-badge.failed {
            background-color: #FFF0F0;
            color: #C53030;
            border: 1px solid #FED7D7;
        }
        .order-body {
            padding: 20px;
        }
        .order-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px dashed var(--primary-light);
        }
        .order-item-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .order-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .order-item-img {
            width: 50px;
            height: 50px;
            border-radius: var(--border-radius-sm);
            object-fit: cover;
            border: 1px solid var(--primary-light);
        }
        .order-item-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-item-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-dark);
        }
        .order-item-qty {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .order-item-price {
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 15px;
        }
        .shipment-section {
            background: #FAF8F6;
            padding: 15px 20px;
            border-top: 1px dashed var(--primary-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .shipment-tracking {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .no-orders-container {
            text-align: center;
            padding: 60px 20px;
            background: #FFFDFC;
            border: 2px dashed var(--primary-light);
            border-radius: var(--border-radius-lg);
            margin: 40px 0;
        }
        .no-orders-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" id="header-logo">
                <svg class="icon-inline" style="animation: spin-slow 10s linear infinite; margin-right: 4px; font-size: 26px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0-9 9M21 12a9 9 0 0 0-9 9M12 3a9 9 0 0 1 9 9M3 12a9 9 0 0 1 9 9M9 6c0 3.3 2.7 6 6 6M15 18c0-3.3-2.7-6-6-6"/></svg> CuteCrochet
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Shop Store <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a></li>
                    <li><a href="about.html">About Us <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></a></li>
                    <li><a href="contact.html">Contact Form <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></a></li>
                </ul>
            </nav>
            <a href="cart.html" class="cart-icon-btn" id="cart-button" title="View Cart">
                <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="20" r="1.5" class="icon-filled"/><circle cx="18" cy="20" r="1.5" class="icon-filled"/><path d="M3 3h2l2.5 10a2 2 0 0 0 2 1.5h8a2 2 0 0 0 2-1.5l1.5-7H6.5"/></svg>
                <span class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <main class="orders-container">
        <h2 class="section-title">My Order History</h2>
        
        <!-- Loading Indicator -->
        <div id="orders-loader" style="text-align: center; padding: 40px 0;">
            <div style="font-size: 32px; animation: spin 2s linear infinite; display: inline-block;">🌸</div>
            <p style="color: var(--text-muted); margin-top: 10px; font-weight: 500;">Retrieving your cozy orders...</p>
        </div>

        <!-- Orders list wrapper -->
        <div id="orders-list" style="display: none;"></div>

        <!-- Empty state -->
        <div id="orders-empty" class="no-orders-container" style="display: none;">
            <span class="no-orders-icon">🧸</span>
            <h3>No Orders Found</h3>
            <p style="color: var(--text-muted); margin-bottom: 25px;">You haven't adopted any crochet friends yet.</p>
            <a href="index.html" class="btn-cute">Browse Store <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 7-7 7 7"/><path d="M12 5v14"/></svg></a>
        </div>
    </main>

    <footer>
        <p>Handmade with <svg class="icon-inline footer-heart icon-filled" style="color: #FF5A79; vertical-align: middle;" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> by CuteCrochet Shop © 2026. Safe & Secure E-Commerce Checkout.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/js/auth.js?v=2.2"></script>
    <script src="/js/app.js?v=2.2"></script>
    <script src="/js/orders.js?v=2.2"></script>
</body>
</html>
