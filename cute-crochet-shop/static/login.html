<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth | Cute Crochet Shop</title>
    <meta name="description" content="Sign in or register securely to manage your crochet basket, update quantities, and checkout safely.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" id="header-logo">
                <svg class="icon-inline" style="animation: spin-slow 10s linear infinite; margin-right: 4px; font-size: 26px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0-9 9M21 12a9 9 0 0 0-9 9M12 3a9 9 0 0 1 9 9M3 12a9 9 0 0 1 9 9M9 6c0 3.3 2.7 6 6 6M15 18c0-3.3-2.7-6-6-6"/></svg> CuteCrochet
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Shop <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="13" r="6"/><circle cx="9.5" cy="11.5" r="0.6" fill="currentColor"/><circle cx="14.5" cy="11.5" r="0.6" fill="currentColor"/><path d="M10 15a2 2 0 0 0 4 0h-4z"/></svg></a></li>
                    <li><a href="about.html">About Us <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></a></li>
                    <li><a href="contact.html">Contact Form <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></a></li>
                </ul>
            </nav>
            <a href="cart.html" class="cart-icon-btn" id="cart-button" title="View Cart">
                <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="20" r="1.5" class="icon-filled"/><circle cx="18" cy="20" r="1.5" class="icon-filled"/><path d="M3 3h2l2.5 10a2 2 0 0 0 2 1.5h8a2 2 0 0 0 2-1.5l1.5-7H6.5"/></svg>
                <span class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <main>
        <div class="auth-container cute-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="4"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
                <button class="auth-tab-btn" id="tab-register" onclick="switchTab('register')">Register <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></button>
            </div>

            <!-- Errors/Success -->
            <div class="form-error" id="auth-error"></div>
            <div class="form-success" id="auth-success"></div>

            <!-- Login Panel -->
            <div class="auth-form-panel active" id="panel-login">
                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email">Email Address <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></label>
                        <input type="email" id="login-email" name="email" placeholder="example@cute.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="4"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-cute" style="width: 100%; text-align: center; margin-top: 10px;">Sign In Securely <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="4"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
                </form>
            </div>

            <!-- Register Panel -->
            <div class="auth-form-panel" id="panel-register">
                <form id="form-register">
                    <div class="form-group">
                        <label for="reg-username">Username <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="13" r="6"/><circle cx="9.5" cy="11.5" r="0.6" fill="currentColor"/><circle cx="14.5" cy="11.5" r="0.6" fill="currentColor"/><path d="M10 15a2 2 0 0 0 4 0h-4z"/></svg></label>
                        <input type="text" id="reg-username" name="username" placeholder="crochet_lover" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email Address <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></label>
                        <input type="email" id="reg-email" name="email" placeholder="example@cute.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="4"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></label>
                        <input type="password" id="reg-password" name="password" placeholder="Minimum 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">Confirm Password <svg class="icon-inline footer-heart icon-filled" style="color: var(--primary);" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></label>
                        <input type="password" id="reg-confirm" name="confirm" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-cute" style="width: 100%; text-align: center; margin-top: 10px;">Create Account <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></button>
                </form>
            </div>

            <!-- Google Auth Divider & Button (Shared for Sign In & Register) -->
            <div style="text-align: center; margin: 24px 0 12px; border-top: 2px dashed var(--stitch-color, #EAE0D5); padding-top: 20px;">
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;">- OR CONTINUE WITH GOOGLE -</p>
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left"
                     style="display: flex; justify-content: center;">
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Handmade with <svg class="icon-inline footer-heart icon-filled" style="color: #FF5A79; vertical-align: middle;" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> by CuteCrochet Shop © 2026. Safe & Secure E-Commerce Checkout.</p>
    </footer>

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/js/auth.js?v=3.0"></script>
    <script src="/js/app.js?v=3.0"></script>

    <script>
        // Tab switching
        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const panelLogin = document.getElementById('panel-login');
            const panelRegister = document.getElementById('panel-register');
            const errorEl = document.getElementById('auth-error');
            const successEl = document.getElementById('auth-success');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (type === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                panelLogin.classList.add('active');
                panelRegister.classList.remove('active');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                panelRegister.classList.add('active');
                panelLogin.classList.remove('active');
            }
        }

        // Get redirect path
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'index.html';

        // Login Submit
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('auth-error');
            const successEl = document.getElementById('auth-success');
            errorEl.style.display = 'none';

            const email = e.target.email.value;
            const password = e.target.password.value;

            try {
                await window.auth.login(email, password);
                successEl.textContent = "Logged in successfully! Redirecting... 🌸";
                successEl.style.display = 'block';
                setTimeout(() => {
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                errorEl.textContent = err.message || "Failed to log in.";
                errorEl.style.display = 'block';
            }
        });

        // Register Submit
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('auth-error');
            const successEl = document.getElementById('auth-success');
            errorEl.style.display = 'none';

            const username = e.target.username.value;
            const email = e.target.email.value;
            const password = e.target.password.value;
            const confirm = e.target.confirm.value;

            if (password.length < 6) {
                errorEl.textContent = "Password must be at least 6 characters long.";
                errorEl.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = "Passwords do not match.";
                errorEl.style.display = 'block';
                return;
            }

            try {
                await window.auth.register(username, email, password);
                successEl.textContent = "Account registered successfully! Redirecting... 🌸";
                successEl.style.display = 'block';
                setTimeout(() => {
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                errorEl.textContent = err.message || "Registration failed.";
                errorEl.style.display = 'block';
            }
        });

        // Google OAuth response handler
        async function handleGoogleCredentialResponse(response) {
            const errorEl = document.getElementById('auth-error');
            const successEl = document.getElementById('auth-success');
            if (errorEl) errorEl.style.display = 'none';
            if (successEl) successEl.style.display = 'none';

            try {
                await window.auth.googleAuth(response.credential);
                if (successEl) {
                    successEl.textContent = "Google Sign-In successful! Redirecting... 🌸";
                    successEl.style.display = 'block';
                }
                setTimeout(() => {
                    window.location.href = redirect || 'index.html';
                }, 800);
            } catch (err) {
                if (errorEl) {
                    errorEl.textContent = err.message || "Google Authentication failed.";
                    errorEl.style.display = 'block';
                }
            }
        }
        window.handleGoogleCredentialResponse = handleGoogleCredentialResponse;

        // Dynamically initialize GOOGLE_CLIENT_ID from environment (.env)
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.auth.isAuthenticated()) {
                window.location.href = redirect;
                return;
            }

            const config = await window.auth.getAuthConfig();
            if (config && config.googleClientId) {
                const gLoad = document.getElementById('g_id_onload');
                if (gLoad) {
                    gLoad.setAttribute('data-client_id', config.googleClientId);
                }
                if (window.google && window.google.accounts) {
                    window.google.accounts.id.initialize({
                        client_id: config.googleClientId,
                        callback: handleGoogleCredentialResponse
                    });
                }
            }
        });
    </script>
</body>
</html>
