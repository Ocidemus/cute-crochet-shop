<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Cute Crochet Shop</title>
    <meta name="description" content="Send us a message for custom crochet orders, feedback, or cozy suggestions. We respond within 24 hours.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" id="header-logo">
                <svg class="icon-inline" style="animation: spin-slow 10s linear infinite; margin-right: 4px; font-size: 26px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0-9 9M21 12a9 9 0 0 0-9 9M12 3a9 9 0 0 1 9 9M3 12a9 9 0 0 1 9 9M9 6c0 3.3 2.7 6 6 6M15 18c0-3.3-2.7-6-6-6"/></svg> CuteCrochet
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Shop <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="13" r="6"/><circle cx="9.5" cy="11.5" r="0.6" fill="currentColor"/><circle cx="14.5" cy="11.5" r="0.6" fill="currentColor"/><path d="M10 15a2 2 0 0 0 4 0h-4z"/></svg></a></li>
                    <li><a href="about.html">About Us <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></a></li>
                    <li class="active"><a href="contact.html">Contact Form <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></a></li>
                </ul>
            </nav>
            <a href="cart.html" class="cart-icon-btn" id="cart-button" title="View Cart">
                <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="20" r="1.5" class="icon-filled"/><circle cx="18" cy="20" r="1.5" class="icon-filled"/><path d="M3 3h2l2.5 10a2 2 0 0 0 2 1.5h8a2 2 0 0 0 2-1.5l1.5-7H6.5"/></svg>
                <span class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <main style="max-width: 650px;">
        <h2 class="section-title">Send a Cute Message</h2>
        <p style="text-align: center; margin-bottom: 30px; color: var(--text-muted); font-weight: 500;">
            Want to ask a question, request a customized colorset, or place a bulk order? Leave your details below and we will get back to you!
        </p>

        <div class="cute-card">
            <!-- Messages -->
            <div class="form-error" id="contact-error"></div>
            <div class="form-success" id="contact-success"></div>

            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">Your Name <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2.5" class="icon-filled"/><circle cx="12" cy="6.5" r="2.5"/><circle cx="17" cy="10" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/><circle cx="7" cy="10" r="2.5"/></svg></label>
                    <input type="text" id="contact-name" name="name" placeholder="e.g. Cutie Pie" required>
                </div>
                <div class="form-group">
                    <label for="contact-email">Email Address <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></label>
                    <input type="email" id="contact-email" name="email" placeholder="hello@cutecompanion.com" required>
                </div>
                <div class="form-group">
                    <label for="contact-message">What would you like to say? <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="13" r="6"/><circle cx="9.5" cy="11.5" r="0.6" fill="currentColor"/><circle cx="14.5" cy="11.5" r="0.6" fill="currentColor"/><path d="M10 15a2 2 0 0 0 4 0h-4z"/></svg></label>
                    <textarea id="contact-message" name="message" rows="5" placeholder="Stitch your message here..." required></textarea>
                </div>
                <button type="submit" class="btn-cute" style="width: 100%; text-align: center; margin-top: 10px;">Send Message <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m2 7 8.2 5.5a3 3 0 0 0 3.6 0L22 7"/></svg></button>
            </form>
        </div>
    </main>

    <footer>
        <p>Handmade with <svg class="icon-inline footer-heart icon-filled" style="color: #FF5A79; vertical-align: middle;" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> by CuteCrochet Shop © 2026. Safe & Secure E-Commerce Checkout.</p>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js?v=2.2"></script>
    <script src="/js/app.js?v=2.2"></script>
</body>
</html>
